<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">扫雷 · 一片待探索的小天地</title>
  <desc id="desc">奶油色方格棋盘上，薄荷绿旗帜与数字交错，旁边生长着一枝小叶。</desc>
  <defs>
    <linearGradient id="bg" x2="600" y2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#eaf0e3"/><stop offset="1" stop-color="#d6e5d5"/></linearGradient>
    <linearGradient id="paper" x2="250" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#fffef6"/><stop offset="1" stop-color="#edf2e5"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#54715c" flood-opacity=".17"/></filter>
    <pattern id="tiles" width="40" height="40" patternUnits="userSpaceOnUse"><rect x="2" y="4" width="35" height="35" rx="5" fill="#b8ccb0"/><rect x="2" y="1" width="35" height="35" rx="5" fill="#e1ecd8" stroke="#bdcfb5"/></pattern>
    <g id="open"><rect x="2" y="1" width="35" height="38" rx="5" fill="#f9f9f0" stroke="#d4dfcd"/></g>
    <g id="flag"><path d="M-8 12H9M-4 11V-13" stroke="#456c53" stroke-width="2.6" stroke-linecap="round"/><path d="M-3-12H11L6-5l5 6H-3Z" fill="#709a72"/></g>
  </defs>
  <path fill="url(#bg)" d="M0 0h600v350H0z"/>
  <ellipse cx="303" cy="281" rx="162" ry="24" fill="#aabd9f" opacity=".2"/>
  <ellipse cx="300" cy="171" rx="208" ry="119" stroke="#b9ccb1" stroke-dasharray="3 8" transform="rotate(-15 300 171)"/>
  <g transform="translate(185 38) rotate(-9 122 130)" filter="url(#shadow)">
    <rect y="7" width="244" height="258" rx="17" fill="#bbceb2"/>
    <rect width="244" height="258" rx="17" fill="url(#paper)" stroke="#b9cdb2"/>
    <circle cx="24" cy="22" r="4" fill="#7b9a6e"/>
    <path d="M36 22h60" stroke="#9cac91" stroke-width="3" stroke-linecap="round"/>
    <text x="218" y="26" text-anchor="end" font-family="monospace" font-size="11" fill="#61795b">010</text>
    <g transform="translate(22 40)">
      <rect width="200" height="200" rx="7" fill="#d5e0ce"/>
      <path d="M0 0h200v200H0z" fill="url(#tiles)"/>
      <use href="#open" x="0" y="0"/><use href="#open" x="40" y="0"/><use href="#open" x="80" y="0"/>
      <use href="#open" x="0" y="40"/><use href="#open" x="40" y="40"/><use href="#open" x="80" y="40"/>
      <use href="#open" x="0" y="80"/><use href="#open" x="40" y="80"/>
      <use href="#open" x="0" y="120"/>
      <g font-family="Georgia,serif" font-size="23" font-weight="bold" text-anchor="middle">
        <text x="100" y="27" fill="#3c766a">1</text><text x="100" y="67" fill="#718449">2</text>
        <text x="60" y="107" fill="#718449">2</text><text x="20" y="107" fill="#3c766a">1</text>
        <text x="20" y="147" fill="#3c766a">1</text>
      </g>
      <use href="#flag" x="140" y="60"/><use href="#flag" x="60" y="140"/>
    </g>
  </g>
  <g transform="translate(113 205) rotate(-13)">
    <rect x="-29" y="-29" width="58" height="64" rx="13" fill="#c1d4b9"/>
    <rect x="-29" y="-34" width="58" height="64" rx="13" fill="#fcfcf1" stroke="#c8d8bf"/>
    <use href="#flag" transform="scale(1.25)"/>
  </g>
  <path d="M478 260q-7-44 21-78" stroke="#89a47d" stroke-width="2" stroke-linecap="round"/>
  <path d="M481 238q-26-5-23-27 25 4 23 27M485 220q26 3 29-21-24 0-29 21M493 198q-16-12-9-29 18 7 9 29" fill="#acc5a0" stroke="#91ad84" stroke-width="1.5"/>
  <path d="m111 93 4 12 12 4-12 4-4 12-4-12-12-4 12-4Z" fill="#a8bd8d"/>
  <path d="m475 78 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#fffdf2"/>
  <circle cx="88" cy="152" r="3" fill="#b1c6a5"/><circle cx="517" cy="141" r="3" fill="#b1c6a5"/>
  <text x="300" y="329" text-anchor="middle" fill="#7f9577" font-family="sans-serif" font-size="9" letter-spacing="3">SMALL STEPS. CLEAR SKIES.</text>
