# Alternative to Docker + Caddy. Do not run both on the same ports.
# Copy public/ contents to /var/www/little-play/.
# Install this file as /etc/nginx/sites-available/little-play and enable it.
server {
    listen 80;
    listen [::]:80;
    server_name games.example.com; # Replace with your domain, or use _ for IP-only testing.
    root /var/www/little-play;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
